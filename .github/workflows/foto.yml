name: Aggiorna foto del portfolio

on:
  push:
    branches: [main]
    paths: ['foto/**']
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: foto
  cancel-in-progress: false

jobs:
  foto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow cryptography
      - name: Installa ffmpeg (video e anteprime)
        run: which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - run: python .github/scripts/build_foto.py
        env:
          PORTFOLIO_PIN: ${{ secrets.PORTFOLIO_PIN }}
      - name: Salva le foto pronte
        run: |
          git config user.name "Portfolio bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A foto miniature foto.js
          if git diff --cached --quiet; then echo "Niente da aggiornare"; exit 0; fi
          git commit -m "Foto aggiornate automaticamente"
          git pull --rebase origin main
          git push
          # Nessuna ripubblicazione forzata: il push qui sopra fa già partire
          # la pubblicazione di GitHub Pages. Forzarne un'altra creava deploy
          # doppi che si annullavano a vicenda e andavano in timeout.
